name: pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends mandoc

      - name: make html
        run: make html

      - name: write index
        run: |
          {
            printf '<!doctype html>\n<html><head><meta charset="utf-8">\n'
            printf '<title>zig-man</title></head><body>\n'
            printf '<h1>zig-man</h1>\n<ul>\n'
            for f in build/html/*.html; do
              name=$(basename "$f" .html)
              printf '<li><a href="%s.html">%s</a></li>\n' "$name" "$name"
            done
            printf '</ul>\n</body></html>\n'
          } > build/html/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
