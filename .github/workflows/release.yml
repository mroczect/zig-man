name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            mandoc groff ghostscript hunspell hunspell-en-us

      - name: verify
        run: make ci

      - name: render
        run: make html pdf txt

      - name: build source tarball
        run: |
          tag="${GITHUB_REF_NAME}"
          prefix="zig-man-${tag#v}"
          git archive --format=tar.gz \
            --prefix="${prefix}/" \
            -o "zig-man-${tag}.tar.gz" \
            HEAD

      - name: build docs tarball
        run: |
          tag="${GITHUB_REF_NAME}"
          tar -czf "zig-man-docs-${tag}.tar.gz" -C build .

      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            zig-man-*.tar.gz
            build/pdf/*.pdf
